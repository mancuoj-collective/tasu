name: Feature request
description: Suggest an idea for tasu
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        tasu is deliberately minimal: no dates, projects, tags, priorities,
        subtasks or notes. Requests that add planning overhead are likely to be
        declined — see the Non-goals section of the README.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
