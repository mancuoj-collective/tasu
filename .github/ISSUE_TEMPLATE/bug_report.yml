name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. tasu is a personal project, so replies may be slow.
  - type: input
    id: version
    attributes:
      label: tasu version
      description: Output of `tasu --version`
      placeholder: tasu 0.12.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: false
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: e.g. iTerm2, Terminal.app, Windows Terminal, kitty
    validations:
      required: false
