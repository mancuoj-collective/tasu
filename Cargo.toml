[package]
name = "tasu"
version = "0.10.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal todo list that ages"
license = "Apache-2.0"
repository = "https://github.com/mancuoj-collective/tasu"
homepage = "https://github.com/mancuoj-collective/tasu"
documentation = "https://docs.rs/tasu"
readme = "README.md"
keywords = ["tui", "todo", "ratatui", "terminal", "cli"]
categories = ["command-line-utilities"]
authors = ["mancuoj <mancuoj@gmail.com>"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive"] }
clap_complete = "4.5"
crossterm = "0.29.0"
dirs = "7.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
terminal-colorsaurus = "1.0.3"
tui-input = "0.15.4"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1"
tempfile = "3"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
